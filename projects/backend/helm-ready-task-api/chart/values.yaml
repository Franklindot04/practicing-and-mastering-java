replicaCount: 1

image:
  repository: example/deployment-ready-task-api
  tag: local
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

container:
  port: 8080

config:
  springProfile: kubernetes-local
  releaseVersion: local-learning
  commitSha: local

secretExample:
  databasePassword: example-only
  jwtSecret: example-local-only-jwt-secret

probes:
  startupPath: /actuator/health
  readinessPath: /actuator/health/readiness
  livenessPath: /actuator/health/liveness

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
