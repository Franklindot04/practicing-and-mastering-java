name: Java CI

on:
  pull_request:
  push:
    branches:
      - learnjava

jobs:
  build:
    name: Maven Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show Java version
        run: java -version

      - name: Run Maven tests
        run: mvn test
