name: Backend Project Tests

on:
  pull_request:
  push:
    branches:
      - learnjava

jobs:
  backend-project-tests:
    name: Backend Maven Projects
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        project:
          - projects/backend/simple-rest-api
          - projects/backend/persistent-task-api
          - projects/backend/secured-task-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run project tests
        run: mvn -f ${{ matrix.project }}/pom.xml test
