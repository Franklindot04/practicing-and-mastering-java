apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api-probes-example
  namespace: learnjava-kubernetes
  labels:
    app: task-api-probes-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-api-probes-example
  template:
    metadata:
      labels:
        app: task-api-probes-example
    spec:
      containers:
        - name: task-api
          image: example/deployment-ready-task-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 12
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
