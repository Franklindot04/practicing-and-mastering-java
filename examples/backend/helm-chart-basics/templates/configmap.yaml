apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "java-backend-basics.fullname" . }}-config
  labels:
    {{- include "java-backend-basics.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfile | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  APP_RELEASE_VERSION: {{ .Values.config.releaseVersion | quote }}
