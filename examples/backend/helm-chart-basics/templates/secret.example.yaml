# Placeholder Secret for learning only. Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "java-backend-basics.fullname" . }}-secret
  labels:
    {{- include "java-backend-basics.labels" . | nindent 4 }}
type: Opaque
stringData:
  DEMO_DATABASE_PASSWORD: {{ .Values.secretExample.databasePassword | quote }}
  DEMO_API_TOKEN: {{ .Values.secretExample.apiToken | quote }}
